# Render Blueprint: one free web service that serves the API and the pre-built 3D viewer (web/dist).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: warehouse-intelligence
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
